<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="apple-mobile-web-app-title" content="Quartier">
<meta name="theme-color" content="#1D3B7A"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon.svg">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}body{margin:0}[hidden]{display:none!important}*{box-sizing:border-box}</style>
</head><body>
<title>Le Quartier</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=Lexend:wght@400;500;600;700&display=swap">
<style>
/* Layout: a one-screen phone app. Scrolling main area, fixed tab bar at the bottom.
   The home screen is a Paris metro line: each unit is a station with an enamel plaque. */
:root{
  --bg:#EDF1F7; --surface:#FFFFFF; --surface-2:#E3E9F3; --ink:#111A2E; --muted:#56617A; --border:#CCD5E4;
  --enamel:#1D3B7A; --enamel-ink:#FFFFFF; --line:#E0A800; --ok:#1C7A55; --ok-bg:#DDF3E9; --bad:#C2362B; --bad-bg:#FBE3E0;
  --gold:#B88600;
  --f-display:"Bricolage Grotesque", "Avenir Next", "Segoe UI", sans-serif;
  --f-body:"Lexend", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --r:14px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0B1120; --surface:#141D31; --surface-2:#1C2741; --ink:#E7ECF6; --muted:#98A4BC; --border:#2A3756;
  --enamel:#3A62BF; --enamel-ink:#FFFFFF; --line:#F2C230; --ok:#45C990; --ok-bg:#12352A; --bad:#FF7A6E; --bad-bg:#3D1A1A; --gold:#F2C230;
  color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#0B1120; --surface:#141D31; --surface-2:#1C2741; --ink:#E7ECF6; --muted:#98A4BC; --border:#2A3756;
  --enamel:#3A62BF; --enamel-ink:#FFFFFF; --line:#F2C230; --ok:#45C990; --ok-bg:#12352A; --bad:#FF7A6E; --bad-bg:#3D1A1A; --gold:#F2C230;
  color-scheme:dark }

html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.45;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button{font:inherit;color:inherit;touch-action:manipulation;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--line);outline-offset:2px}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:1.1}
.app{display:flex;flex-direction:column;height:100%}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;align-items:center;gap:12px;
  padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));border-bottom:1px solid var(--border)}
.brand{font-family:var(--f-display);font-weight:800;font-size:20px;letter-spacing:-.01em;flex:1;min-width:0}
.brand small{display:block;font-family:var(--f-body);font-weight:400;font-size:12px;color:var(--muted);letter-spacing:.02em}
.stat{display:flex;align-items:center;gap:5px;font-weight:600;font-variant-numeric:tabular-nums;font-size:15px}
.stat svg{width:18px;height:18px}
.ring{width:38px;height:38px;position:relative}
.ring svg{width:38px;height:38px;transform:rotate(-90deg)}
.ring span{position:absolute;inset:0;display:grid;place-items:center;font-size:9px;font-weight:700;letter-spacing:-.02em}
main{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding-block:16px 110px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;display:grid;grid-template-columns:repeat(5,1fr);background:var(--surface);border-top:1px solid var(--border);
  padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.tabs button{background:none;border:0;padding:8px 2px 10px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;color:var(--muted)}
.tabs button svg{width:24px;height:24px}
.tabs button[aria-current="page"]{color:var(--enamel);font-weight:600}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .tabs button[aria-current="page"]{color:var(--line)} }
:root[data-theme="dark"] .tabs button[aria-current="page"]{color:var(--line)}

.eyebrow{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:16px}
.muted{color:var(--muted)}
.btn{border:0;border-radius:12px;padding:14px 18px;font-weight:600;font-size:16px;background:var(--enamel);color:var(--enamel-ink);box-shadow:0 3px 0 rgba(0,0,0,.25)}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(0,0,0,.25)}
.btn.ghost{background:var(--surface-2);color:var(--ink);box-shadow:none}
.btn.ok{background:var(--ok);color:#fff}
.btn.bad{background:var(--bad);color:#fff}
.btn.wide{width:100%}
.btn[disabled]{opacity:.45}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}

/* Daily panel */
.hero{background:var(--enamel);color:var(--enamel-ink);border-radius:18px;padding:18px;display:flex;flex-direction:column;gap:12px}
.hero h1{font-size:26px}
.hero p{margin:0;opacity:.9}
.hero .row .btn{background:var(--line);color:#1A1400}
.hero .row .btn.ghost{background:rgba(255,255,255,.16);color:#fff}

/* Metro line map */
.line{position:relative;display:flex;flex-direction:column;gap:14px;padding-left:34px}
.line::before{content:"";position:absolute;left:12px;top:18px;bottom:18px;width:8px;border-radius:4px;background:var(--line)}
.stop{position:relative;display:flex;flex-direction:column;gap:8px;text-align:left;background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:12px 14px;width:100%}
.stop::before{content:"";position:absolute;left:-31px;top:18px;width:18px;height:18px;border-radius:50%;background:var(--surface);border:4px solid var(--line)}
.stop.done::before{background:var(--line)}
.stop.locked{opacity:.55}
.plaque{display:inline-flex;align-self:flex-start;background:var(--enamel);color:var(--enamel-ink);font-family:var(--f-display);font-weight:700;font-size:17px;padding:5px 12px;border-radius:6px;border:2px solid var(--enamel-ink);box-shadow:0 0 0 2px var(--enamel);letter-spacing:.01em}
.stop .meta{display:flex;align-items:center;gap:10px;font-size:14px;color:var(--muted)}
.pips{display:flex;gap:4px;margin-left:auto}
.pips i{width:10px;height:10px;border-radius:50%;background:var(--surface-2);border:1px solid var(--border)}
.pips i.on{background:var(--ok);border-color:var(--ok)}
.lvl{font-size:11px;font-weight:700;padding:2px 7px;border-radius:999px;background:var(--surface-2);color:var(--ink)}
.av{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:700;font-size:13px;flex:none}

/* Sheet */
.sheet-bg{position:fixed;inset:0;background:rgba(5,10,25,.55);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:600px;max-height:88%;overflow-y:auto;border-radius:20px 20px 0 0;display:flex;flex-direction:column;gap:14px;
  padding-block:18px calc(18px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.gram{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:14px;font-size:15px}
.gram i{color:var(--enamel)}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .gram i{color:var(--line)} }
:root[data-theme="dark"] .gram i{color:var(--line)}
.lessons{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.lessons .btn{display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left}
.lessons .btn small{font-weight:400;font-size:12px;opacity:.85}

/* Player */
.player{position:fixed;inset:0;z-index:30;background:var(--bg);display:flex;flex-direction:column;
  padding-top:env(safe-area-inset-top,0px)}
.p-top{display:flex;align-items:center;gap:12px;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.x{background:none;border:0;width:36px;height:36px;display:grid;place-items:center;color:var(--muted)}
.bar{flex:1;height:12px;border-radius:6px;background:var(--surface-2);overflow:hidden}
.bar b{display:block;height:100%;background:var(--ok);border-radius:6px;transition:width .3s}
.combo{font-weight:700;color:var(--gold);font-variant-numeric:tabular-nums;min-width:44px;text-align:right}
.p-body{flex:1;overflow-y:auto;padding-block:8px 16px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.p-inner{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
.q-kind{font-size:13px;color:var(--muted);font-weight:600;letter-spacing:.04em;text-transform:uppercase}
.q{font-family:var(--f-display);font-size:26px;font-weight:700;line-height:1.2}
.fr{font-family:var(--f-display);font-weight:700}
.say{display:inline-flex;align-items:center;gap:8px;background:var(--enamel);color:var(--enamel-ink);border:0;border-radius:12px;padding:10px 14px;font-weight:600}
.say.slow{background:var(--surface-2);color:var(--ink)}
.say svg{width:20px;height:20px}
.big-say{width:92px;height:92px;border-radius:24px;justify-content:center;padding:0}
.big-say svg{width:40px;height:40px}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{background:var(--surface);border:2px solid var(--border);border-bottom-width:4px;border-radius:14px;padding:14px 16px;text-align:left;font-size:17px}
.opt.right{border-color:var(--ok);background:var(--ok-bg)}
.opt.wrong{border-color:var(--bad);background:var(--bad-bg)}
.inp{width:100%;font:inherit;font-size:18px;padding:14px;border-radius:14px;border:2px solid var(--border);background:var(--surface);color:var(--ink);min-height:96px;resize:none}
.accents{display:flex;flex-wrap:wrap;gap:6px}
.accents button{min-width:40px;height:40px;border-radius:10px;border:1px solid var(--border);background:var(--surface);font-size:17px}
.tiles{display:flex;flex-wrap:wrap;gap:8px;min-height:56px;padding:10px;border-radius:14px;border:2px dashed var(--border)}
.tiles.bank{border:0;padding:0}
.tile{background:var(--surface);border:2px solid var(--border);border-bottom-width:4px;border-radius:12px;padding:8px 12px;font-size:17px}
.tile.used{opacity:.35;border-style:dashed}
.intro{display:flex;flex-direction:column;align-items:center;text-align:center;gap:12px;padding:24px 16px;background:var(--surface);border:1px solid var(--border);border-radius:18px}
.intro .fr{font-size:36px}
.intro.sent .fr{font-size:26px;line-height:1.25}
.hintline{font-size:22px;letter-spacing:.12em;font-variant-ligatures:none}
.chat{display:flex;flex-direction:column;gap:10px}
.bub{max-width:85%;padding:10px 14px;border-radius:16px;font-size:16px}
.bub.npc{background:var(--surface);border:1px solid var(--border);align-self:flex-start;border-bottom-left-radius:4px}
.bub.me{background:var(--enamel);color:var(--enamel-ink);align-self:flex-end;border-bottom-right-radius:4px}
.bub .en{display:block;font-size:13px;opacity:.75;margin-top:4px}
.linkish{background:none;border:0;color:var(--muted);text-decoration:underline;padding:0;font-size:14px}
.p-foot{border-top:1px solid var(--border);background:var(--surface);
  padding-block:14px calc(14px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.p-foot.ok{background:var(--ok-bg);border-color:var(--ok)}
.p-foot.bad{background:var(--bad-bg);border-color:var(--bad)}
.p-foot .in{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:10px}
.fb-title{font-family:var(--f-display);font-weight:800;font-size:20px}
.p-foot.ok .fb-title{color:var(--ok)} .p-foot.bad .fb-title{color:var(--bad)}
.timer{font-variant-numeric:tabular-nums;font-weight:700;font-size:18px}
.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.pop{animation:pop .4s}
@keyframes pop{50%{transform:scale(1.15)}}
@media (prefers-reduced-motion: reduce){.shake,.pop{animation:none}.bar b{transition:none}}

/* Results */
.result{display:flex;flex-direction:column;align-items:center;text-align:center;gap:16px;padding-top:24px}
.result h2{font-size:32px}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;width:100%}
.kpi{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:12px 6px}
.kpi b{display:block;font-family:var(--f-display);font-size:26px;font-variant-numeric:tabular-nums}
.kpi span{font-size:12px;color:var(--muted)}

/* Tables and lists */
.tbl{width:100%;border-collapse:collapse;font-size:16px}
.tbl td{padding:10px 6px;border-bottom:1px solid var(--border)}
.tbl td:first-child{color:var(--muted);width:34%}
.tbl button{background:none;border:0;padding:0;text-align:left;font-weight:600}
select.inp{min-height:0;font-size:16px;padding:12px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--border);background:var(--surface);border-radius:999px;padding:8px 14px;font-size:14px}
.chip[aria-pressed="true"]{background:var(--enamel);color:var(--enamel-ink);border-color:var(--enamel)}
.friends{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.friend{display:flex;gap:10px;align-items:center;background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:10px;min-width:0}
.friend div{min-width:0}
.friend b{display:block;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hearts{color:var(--bad);font-size:13px;letter-spacing:1px}
.hearts .off{color:var(--border)}
.lb{display:flex;flex-direction:column}
.lb-row{display:flex;align-items:center;gap:10px;padding:10px 4px;border-bottom:1px solid var(--border);font-variant-numeric:tabular-nums}
.lb-row.me{background:var(--surface-2);border-radius:10px}
.lb-row .rk{width:24px;text-align:center;font-weight:700;color:var(--muted)}
.lb-row .nm{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}
.lb-row img{width:30px;height:30px;border-radius:50%}
.bars{display:flex;align-items:flex-end;gap:6px;height:90px}
.bars div{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px;color:var(--muted);height:100%;justify-content:flex-end}
.bars i{display:block;width:100%;background:var(--enamel);border-radius:5px 5px 0 0;min-height:3px}
.bars div.today i{background:var(--line)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:40;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;max-width:90%}
</style>
<div class="app">
  <header class="top" id="top"></header>
  <main id="main"></main>
  <nav class="tabs" id="tabs" aria-label="Sections"></nav>
</div>
<div class="sheet-bg" id="sheet" hidden></div>
<div class="player" id="player" hidden></div>
<script>
// Course content. Each unit is a place in the neighbourhood with one neighbour (NPC).
// words: "french|english"   sents: "french|english|alt1;alt2"
// dlg: [npc line, english, [[correct fr, en], [wrong fr, en, hint?], ...]]  (first option is correct)
const UNITS = [
{ id:"cafe", place:"Le Café", npc:"Margaux", role:"barista", level:"A1",
  gram:"<b>Être</b> (to be): je suis, tu es, il/elle est, nous sommes, vous êtes, ils/elles sont.<br><b>Tu or vous?</b> Use <i>vous</i> with strangers, shop staff and anyone older. Use <i>tu</i> with friends. If unsure, say <i>vous</i>.",
  conj:{verbs:["être"],tenses:["pres"]},
  words:["bonjour|hello","salut|hi","merci|thank you","s'il vous plaît|please (formal)","oui|yes","non|no","au revoir|goodbye","je suis|I am","tu es|you are (informal)","vous êtes|you are (formal)","elle est|she is","un café|a coffee","un thé|a tea","l'eau|water","ça va ?|how are you?","très bien|very well","enchanté|nice to meet you"],
  sents:["Bonjour, je suis Margaux.|Hello, I am Margaux.","Comment ça va ?|How are you?|Ça va ?","Ça va très bien, merci.|I'm very well, thanks.|Très bien, merci.","Un café, s'il vous plaît.|A coffee, please.","Vous êtes américain ?|Are you American?|Êtes-vous américain ?;Vous êtes américaine ?","Je suis étudiant.|I am a student.|Je suis étudiante.","Elle est très sympa.|She is very nice.","Merci, au revoir !|Thanks, goodbye!"],
  dlg:[
   ["Bonjour ! Qu'est-ce que je vous sers ?","Hello! What can I get you?",[["Un café, s'il vous plaît.","A coffee, please."],["Je suis un café.","I am a coffee.","« Je suis » means I am. To order, just name the thing + s'il vous plaît."],["Au revoir, merci !","Goodbye, thanks!","You just arrived. Order something first."]]],
   ["Très bien. Vous êtes nouveau dans le quartier ?","Very good. Are you new in the neighbourhood?",[["Oui, je suis nouveau. Je m'appelle Alex.","Yes, I'm new. My name is Alex."],["Non, je suis un thé.","No, I am a tea.","Careful: je suis = I am."],["Ça va très bien.","I'm very well.","She asked if you're new, not how you are."]]],
   ["Enchantée, Alex ! Moi, c'est Margaux.","Nice to meet you, Alex! I'm Margaux.",[["Enchanté, Margaux !","Nice to meet you, Margaux!"],["Oui, s'il vous plaît.","Yes, please.","She introduced herself. Reply with enchanté."],["Il est Margaux.","He is Margaux.","Il = he. Margaux is talking about herself."]]],
   ["Voilà votre café. Bonne journée !","Here's your coffee. Have a good day!",[["Merci, bonne journée !","Thanks, have a good day!"],["Bonjour !","Hello!","You're leaving: say merci and bonne journée."],["Je suis très café.","I am very coffee.","That means 'I am very coffee'."]]]
  ]},
{ id:"boulangerie", place:"La Boulangerie", npc:"M. Bernard", role:"baker", level:"A1",
  gram:"<b>Un / une</b>: every noun has a gender. <i>un croissant</i> (m), <i>une baguette</i> (f). Learn each noun with its article.<br><b>Je voudrais…</b> (I would like) is the polite way to order anything.<br>Numbers: un, deux, trois, quatre, cinq, six, sept, huit, neuf, dix… vingt.",
  conj:{verbs:["vouloir"],tenses:["cond"]},
  words:["le pain|bread","la baguette|baguette","un croissant|a croissant","je voudrais|I would like","combien|how much","deux|two","trois|three","quatre|four","cinq|five","dix|ten","vingt|twenty","c'est|it is","voilà|here it is","et|and","avec|with","tout|all"],
  sents:["Je voudrais une baguette, s'il vous plaît.|I would like a baguette, please.","C'est combien ?|How much is it?|Ça fait combien ?;Combien ça coûte ?","Ça fait deux euros.|That's two euros.|C'est deux euros.","Deux croissants et un pain au chocolat.|Two croissants and a pain au chocolat.","Voilà, monsieur.|Here you go, sir.","Avec ceci ?|Anything else?","C'est tout, merci.|That's all, thanks.","Bonne journée !|Have a good day!"],
  dlg:[
   ["Bonjour ! Vous désirez ?","Hello! What would you like?",[["Je voudrais une baguette, s'il vous plaît.","I'd like a baguette, please."],["Je suis une baguette.","I am a baguette.","Use je voudrais to order."],["C'est tout, au revoir.","That's all, goodbye.","You haven't ordered anything yet."]]],
   ["Une baguette. Avec ceci ?","One baguette. Anything else?",[["Deux croissants, s'il vous plaît.","Two croissants, please."],["Combien croissants ?","How many croissants?","He's asking what else you want."],["Bonjour, monsieur.","Hello, sir.","You already said hello."]]],
   ["Et voilà. Autre chose ?","There you go. Anything else?",[["Non, c'est tout. C'est combien ?","No, that's all. How much is it?"],["Je voudrais au revoir.","I would like goodbye.","Say c'est tout (that's all)."],["Vingt baguettes, merci !","Twenty baguettes, thanks!","That's a lot of bread. Say c'est tout."]]],
   ["Ça fait trois euros dix.","That's three euros ten.",[["Voilà. Merci, bonne journée !","Here. Thanks, have a nice day!"],["Ça va très bien.","I'm very well.","He told you the price. Pay and say thanks."],["Trois croissants !","Three croissants!","He's telling you the price."]]]
  ]},
{ id:"appart", place:"L'Appartement", npc:"Inès", role:"neighbour", level:"A1",

const STORE_KEY = "quartier-save-v1";
const fresh = () => ({ v: 1, xp: 0, streak: 0, lastDay: "", goal: 150, rate: 0.95, items: {}, units: {}, friends: {}, days: {}, updatedAt: 0 });
let S = fresh();
try { const raw = localStorage.getItem(STORE_KEY); if (raw) S = Object.assign(fresh(), JSON.parse(raw)); } catch (e) { }
function save(cloud) {
  S.updatedAt = Date.now();
  try { localStorage.setItem(STORE_KEY, JSON.stringify(S)); } catch (e) { }
  if (cloud) Cloud.push();
}
const level = () => Math.floor(Math.sqrt(S.xp / 60)) + 1;
const todayXp = () => S.days[todayKey()] || 0;
function addXp(n) {
  const t = todayKey();
  if (S.lastDay !== t) {
    const y = todayKey(new Date(Date.now() - DAY));
    S.streak = S.lastDay === y ? S.streak + 1 : 1;
    S.lastDay = t;
  }
  S.xp += n; S.days[t] = (S.days[t] || 0) + n;
  const keys = Object.keys(S.days).sort(); while (keys.length > 60) delete S.days[keys.shift()];
}

    const st = unitState(u.id);
    if (!st.l[P.li]) { st.l[P.li] = 1; S.friends[u.id] = Math.min(5, (S.friends[u.id] || 0) + 1); notes.push(`${u.npc} likes you more.`); }

  </div></div><div class="p-foot"><div class="in"><button class="btn wide" id="done">Continue</button></div></div>`;

/* ---------- player events ---------- */
document.addEventListener("click", ev => {
  const t = ev.target.closest("button"); if (!t) return;
  if (t.dataset.say) { speak(t.dataset.say, !!t.dataset.slow); return; }
  if (!P) return;
  const e = P.q[P.i];
  if (t.id === "quit" || t.id === "done") return quitSession();
  if (t.id === "next") return next();
  if (t.id === "check") return doCheck();
  if (t.id === "skip") return next();
  if (t.id === "hintbtn") {
    e.shown = (e.shown || 0) + 1; e.usedHint = true;
    const h = $("#hintline"); if (h) h.textContent = mask(e.answers[0], e.shown);
    return;
  }
  if (t.id === "showtr") { const tr = $("#tr"); if (tr) tr.hidden = false; t.hidden = true; return; }
  if (t.dataset.acc) { const i = $("#ans"); if (!i || i.disabled) return; const s = i.selectionStart ?? i.value.length; i.value = i.value.slice(0, s) + t.dataset.acc + i.value.slice(i.selectionEnd ?? s); i.focus(); i.selectionStart = i.selectionEnd = s + 1; return; }
  if (t.dataset.opt != null && e.t === "mc") {
    if ($("#foot").classList.contains("ok") || $("#foot").classList.contains("bad") || $(".opt.right")) return;
    const ch = e.opts[+t.dataset.opt], ok = ch === e.ans;
    t.classList.add(ok ? "right" : "wrong");
    if (!ok) document.querySelectorAll(".opt").forEach(b => { if (b.textContent === e.ans) b.classList.add("right"); });
    const info = e.item ? `<span class="fr">${esc(e.item.fr)}</span> = ${esc(e.item.en)}` : `<span class="fr">${esc(e.say)}</span>`;
    feedback(ok, ok ? pick(PRAISE) : "Not quite", info, e.item);
    if (P.mode !== "sprint") speak(e.say || e.item.fr);
    return;
  }
  if (e.t === "tiles" && !e.checked && (t.dataset.tile != null || t.dataset.back != null || t.id === "cleartiles")) {
    if (t.id === "cleartiles") e.picked = [];
    else { const k = +(t.dataset.tile ?? t.dataset.back); e.picked = e.picked.includes(k) ? e.picked.filter(x => x !== k) : e.picked.concat(k); }
    drawTiles(e);
    return;
  }
  if (t.id === "selfok" && e.t === "speak") { feedback(true, "Bien !", "Shadowing every day trains your mouth and your ear at once.", e.item); return; }
  if (t.id === "mic" && e.t === "speak") {
    t.disabled = true; t.textContent = "Listening…";
    listen().then(alts => {
      const best = alts.reduce((m, a) => Math.max(m, speechScore(a, e.item.fr)), 0);
      if (best >= 0.7) feedback(true, pick(PRAISE), `I heard: <span class="fr">${esc(alts[0])}</span>`, e.item);
      else { t.disabled = false; t.textContent = "Try again"; toast(`I heard: "${alts[0]}". Try again, a bit slower.`); }
    }).catch(err => { t.disabled = false; t.textContent = "Tap and speak"; toast(err === "not-allowed" || err === "service-not-allowed" ? "Microphone is blocked here. Say it out loud, then tap the link below." : "I didn't catch that. Try again."); });
    return;
  }
  if (t.dataset.dopt != null && e.t === "dlg") {
    const o = e.opts[+t.dataset.dopt];
    if (o.ok) {
      document.querySelectorAll("[data-dopt]").forEach(b => b.disabled = true);
      t.classList.add("right");
      P.chat[P.chat.length - 1].en = e.turn[1];
      P.chat.push({ who: "me", fr: o.fr, en: o.en });
      P.xp += P.wrongTurn ? 3 : 8; P.right++; P.graded++; P.wrongTurn = false;
      speak(o.fr);

    } else {
      t.classList.add("wrong"); t.disabled = true; P.graded++; P.wrongTurn = true;

    }
  }
});

  const units = UNITS.filter(unitDone).length;
  const cefr = units >= 15 ? "B1" : units >= 11 ? "A2+" : units >= 6 ? "A2" : units >= 1 ? "A1" : "Beginner";
  return `<h2 style="font-size:28px">Your progress</h2>
    <div class="kpis"><div class="kpi"><b>${S.xp}</b><span>total XP</span></div><div class="kpi"><b>${knownCount()}</b><span>known items</span></div><div class="kpi"><b>${cefr}</b><span>estimated level</span></div></div>
    <div class="card"><div class="eyebrow">Daily goal</div><p style="margin:.4em 0 .8em">How fast do you want to go? Intensive is about 45 minutes a day and covers the whole line in roughly 6 to 8 weeks.</p>
      <div class="chips" role="group" aria-label="Daily goal">${[[60, "Relaxed · 60 XP"], [150, "Serious · 150 XP"], [400, "Intensive · 400 XP"], [700, "All in · 700 XP"]].map(([v, l]) => `<button class="chip" data-goal="${v}" aria-pressed="${S.goal === v}">${l}</button>`).join("")}</div></div>
    <div class="card"><div class="eyebrow">Voice speed</div><div class="chips" style="margin-top:8px">${[[0.75, "Slower"], [0.95, "Normal"], [1.1, "Native"]].map(([v, l]) => `<button class="chip" data-rate="${v}" aria-pressed="${S.rate === v}">${l}</button>`).join("")}</div>
      <p class="muted" style="font-size:14px;margin:.6em 0 0">No sound on iPhone? Turn off silent mode. For a better voice, download a French voice in Settings › Accessibility › Spoken Content › Voices.</p></div>
    <div class="card"><div class="eyebrow">How Le Quartier teaches</div>
      <ul style="margin:.5em 0 0;padding-left:1.1em;display:grid;gap:6px">
        <li><b>No lives, no paywall.</b> Mistakes come back at the end of the lesson until you get them right.</li>
        <li><b>You produce French.</b> Most exercises have you type, build or say French, not just recognise it.</li>
        <li><b>Spaced repetition</b> brings each word back right before you'd forget it.</li>
        <li><b>Real conversations</b> with neighbours test what you learned in context.</li>
        <li><b>Skip tests</b> let you jump ahead when you already know something.</li>
      </ul></div>
    <div class="card"><div class="eyebrow">Sync</div><p style="margin:.4em 0 0" id="syncmsg">${Cloud.syncText()}</p></div>
    <div class="card"><div class="eyebrow">Start over</div><p style="margin:.4em 0 .8em">Erase all progress on this device.</p><button class="btn ghost" id="reset">Erase progress</button></div>`;
}
function render() {
  header();
  const m = $("#main");
  m.innerHTML = `<div class="wrap">${{ map: screenMap, review: screenReview, conj: screenConj, friends: screenFriends, profile: screenProfile }[TAB]()}</div>`;
  document.querySelectorAll(".tabs button").forEach(b => b.setAttribute("aria-current", b.dataset.tab === TAB ? "page" : "false"));
}
$("#tabs").innerHTML = [["map", "Quartier", ICON.map], ["review", "Review", ICON.cards], ["conj", "Verbs", ICON.grid], ["friends", "Neighbours", ICON.people], ["profile", "Me", ICON.user]]
  .map(([k, l, i]) => `<button data-tab="${k}">${i}${l}</button>`).join("");
document.addEventListener("click", ev => {
  const t = ev.target.closest("button,[data-close]"); if (!t || P) return;
  if (t.dataset.tab) { TAB = t.dataset.tab; render(); $("#main").scrollTop = 0; return; }
  if (t.hasAttribute("data-close")) return closeSheet();
  if (t.dataset.unit) return openUnit(+t.dataset.unit);
  if (t.dataset.lesson) { const [ui, li] = t.dataset.lesson.split(",").map(Number); return startSession("lesson", { ui, li }); }
  if (t.dataset.conv) return startSession("conv", { ui: +t.dataset.conv });
  if (t.dataset.test) return startSession("test", { ui: +t.dataset.test });
  if (t.dataset.go === "review") return startSession("review");
  if (t.dataset.go === "sprint") return startSession("sprint");
  if (t.dataset.go === "next") { const nx = nextLesson(); if (!nx) return startSession("review"); return nx.conv ? startSession("conv", { ui: nx.ui }) : startSession("lesson", nx); }
  if (t.dataset.tense) { CJ.tense = t.dataset.tense; return render(); }
  if (t.dataset.drill) return startSession("conj", { ...CJ });
  if (t.dataset.goal) { S.goal = +t.dataset.goal; save(); return render(); }
  if (t.dataset.rate) { S.rate = +t.dataset.rate; save(); speak("Bonjour, ça va ?"); return render(); }
  if (t.id === "reset") { if (t.dataset.armed) { S = fresh(); save(true); toast("Progress erased."); return render(); } t.dataset.armed = "1"; t.textContent = "Tap again to erase everything"; t.className = "btn bad"; return; }
});
document.addEventListener("change", ev => { if (ev.target.id === "cjverb") { CJ.inf = ev.target.value; render(); } });


/* ---------- cloud: sync + friends leaderboard (only inside Claude) ---------- */
const Cloud = {
  db: null, user: null, uid: null, board: null, names: {}, state: "local", queue: Promise.resolve(),
  async init() {
    if (!window.claude || typeof window.claude.use !== "function") return;
    try {
      const [db, user] = await Promise.all([window.claude.use("db"), window.claude.use("user")]);
      if (!db || !user) return;
      this.user = user; this.uid = await user.id();
      if (!this.uid) return;
      this.db = db; this.state = "on";
      const snap = await db.doc("data/users/" + this.uid + "/save").get().catch(() => null);
      if (snap && snap.exists) {
        const d = snap.data();
        if (d && d.updatedAt > S.updatedAt && d.json) { try { S = Object.assign(fresh(), JSON.parse(d.json)); localStorage.setItem(STORE_KEY, d.json); } catch (e) { } }
      }
      db.collection("board").orderBy("xp", "desc").limit(50).onSnapshot(async s => {
        this.board = s.docs.map(d => ({ id: d.id, ...d.data() }));
        try { const ps = await user.profiles(this.board.map(b => b.id)); for (const id in ps) this.names[id] = ps[id]; } catch (e) { }
        const lb = $("#lb"); if (lb) lb.innerHTML = this.boardHtml();
      }, () => { this.board = []; });
      if (!P) render();
    } catch (e) { this.state = "local"; }
  },
  push() {
    if (this.state !== "on") return;
    const snapshot = JSON.stringify(S), at = S.updatedAt;
    const entry = { xp: S.xp, level: level(), streak: S.streak, stations: UNITS.filter(unitDone).length, updated: Date.now() };
    this.queue = this.queue.then(async () => {
      try { await this.db.doc("data/users/" + this.uid + "/save").set({ json: snapshot, updatedAt: at }); } catch (e) { }
      try { await this.db.doc("board/" + this.uid).set(entry); } catch (e) { this.boardRO = true; }
    });
  },
  boardHtml() {
    if (this.state !== "on") return `<p style="margin:0">The shared leaderboard works when you open Le Quartier through its Claude link while signed in. Share the link with friends so you can see each other's XP and streaks.</p>`;
    if (!this.board) return `<p class="muted" style="margin:0">Loading…</p>`;
    if (!this.board.length) return `<p style="margin:0">No one is on the board yet. Finish a lesson to be first, then share this page with friends.</p>`;
    return `<div class="lb">${this.board.map((b, i) => { const p = this.names[b.id] || {}; const me = b.id === this.uid; return `<div class="lb-row ${me ? "me" : ""}"><span class="rk">${i + 1}</span>${p.avatarUrl ? `<img src="${esc(p.avatarUrl)}" alt="">` : `<span class="av" style="background:${esc(p.color || "#56617A")}">?</span>`}<span class="nm">${esc(p.name || "Neighbour")}${me ? " (you)" : ""}</span><span class="muted" style="font-size:13px">Lv ${+b.level || 1} · ${+b.streak || 0}d</span><b>${+b.xp || 0}</b></div>`; }).join("")}</div>
      ${this.boardRO ? `<p class="muted" style="font-size:13px;margin:.6em 0 0">Your score can't be posted with view-only access. Ask the owner to share the page with you as Contributor.</p>` : ""}`;
  },
  syncText() { return this.state === "on" ? "Your progress is saved to your Claude account and follows you to any device where you open this page." : "Progress is saved on this device. Open the Claude link while signed in to sync across devices."; }
};

/* ---------- boot ---------- */
render();
Cloud.init();
</script>
</body></html>
